<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI Interview Coach</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
        }

        .auth-card h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-card p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .auth-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-glass);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 28px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            border: none;
            background: transparent;
            font-family: var(--font-main);
        }

        .auth-tab.active {
            background: var(--gradient-primary);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin: 20px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--border-glass);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash-msg {{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="auth-container" style="position:relative; z-index:1;">
        <div class="glass-card auth-card animate-fade-in">
            <a href="/"
                style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:24px; font-size:24px; text-decoration:none; color:var(--text-primary);">
                <span
                    style="background:var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:700;">AI
                    Interview Coach</span>
            </a>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showForm('login')" id="tab-login">Login</button>
                <button class="auth-tab" onclick="showForm('register')" id="tab-register">Register</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="form-login" method="POST" action="/login">
                <div class="form-group">
                    <label for="login-user">Username</label>
                    <input type="text" id="login-user" name="username" class="form-input"
                        placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="login-pass">Password</label>
                    <input type="password" id="login-pass" name="password" class="form-input"
                        placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Login →</button>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="form-register" method="POST" action="/register">
                <div class="form-group">
                    <label for="reg-user">Username</label>
                    <input type="text" id="reg-user" name="username" class="form-input" placeholder="Choose a username"
                        required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" class="form-input" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="reg-pass">Password</label>
                    <input type="password" id="reg-pass" name="password" class="form-input"
                        placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Create Account
                    →</button>
            </form>

            <p style="text-align:center; margin-top:24px; font-size:13px; color:var(--text-muted);">
                By continuing you agree to our Terms of Service
            </p>
        </div>
    </div>

    <script>
        function showForm(type) {
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('form-' + type).classList.add('active');
            document.getElementById('tab-' + type).classList.add('active');
        }

        // Auto-hide flash
        setTimeout(() => {
            document.querySelectorAll('.flash-msg').forEach(el => {
                el.style.transition = 'opacity 0.5s'; el.style.opacity = '0';
                setTimeout(() => el.remove(), 500);
            });
        }, 4000);
    </script>

</body>

</html>
